<svg class="defs" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
  <!-- Displacement has to scale with the mark it roughens. At 2.4 the wobble is
       nearly as wide as a 6pt checkbox and shreds it into noise, while a 200pt
       frame needs that much to read as hand-drawn at all. Hence two filters —
       and marks smaller than ~8pt get neither, just uneven corner radii. -->
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough-fine">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
