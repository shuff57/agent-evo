# Chains are sequential pipelines where each step's output feeds the next.
#
# All six chains were dissolved on 2026-09-19 alongside the 19-agent omo
# retirement: plan-build, scout-flow, plan-review-plan, full-review,
# research-plan-build, oracle-then-build. Every step of every chain named a
# retired agent (scout, planner, critic, code-engineer, librarian, oracle), so
# not one had a resolvable step left. Restore them — and the agents they name —
# with `git checkout HEAD~1 -- roster/`.
#
# The shapes they encoded now live in omo: sisyphus plans and delegates,
# prometheus -> atlas is the plan-then-execute pipeline, and `review-work` is
# the review tail. A chain step may only name a roster/<name>.md file, which
# test.sh enforces, so an omo builtin cannot be a step — repointing these at
# `explore`/`prometheus`/`momus` needs that validator extended first.
#
# ultrawork and deep-interview-then-build moved to commands/ultrawork.md
# and commands/deep-interview.md — slash commands are the canonical seam
# for those two workflows.
